[package]
name = "hnl-engine-lex"
version = "0.1.0"
edition = "2024"
description = "The abstraction crate for the lex operation (ADR-0044 §3)."
license = "MIT"
repository = "https://github.com/handl-lang/engine-lex"
homepage = "https://handl-lang.github.io/docs/engine-lex/"
documentation = "https://handl-lang.github.io/docs/engine-lex/reference/"
readme = "README.md"
keywords = ["handl", "engine", "lexer", "language-as-data"]
categories = ["parser-implementations", "compilers"]
# Git-install only: https://github.com/handl-lang/engine-lex (no crates.io).
publish = false

[dependencies]
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
serde_json = "1"
